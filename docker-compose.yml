version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Tazim@123
      MYSQL_DATABASE: nexora_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Tazim@123
      DB_NAME: nexora_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: nexora_production_docker_jwt_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-worker
    restart: always
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Tazim@123
      DB_NAME: nexora_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: nexora_production_docker_jwt_secret_key_2026
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - nexora-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nexora-network

networks:
  nexora-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
